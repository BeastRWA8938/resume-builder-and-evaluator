version: '3.8'

services:
  resume-suite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-suite-app
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite databases
      - ./backend:/app/backend
      # Persist generated output resumes
      - c:/Users/Rushikesh/Documents/Resume:/app/Resumes
      # Mount personal markdown experience vault
      - ./Knowledge Base:/app/Knowledge Base
      # Mount frontend code for live updates
      - ./frontend:/app/frontend
      # Mount LaTeX templates and fonts
      - ./Resume-Latex:/app/Resume-Latex
    env_file:
      - .env
    environment:
      - ALLOWED_ORIGINS=*
      - DATABASE_PATH=/app/backend/resume_analyzer.db
    restart: unless-stopped
